name: Build THE HOUSE for Windows

on:
  push:
    branches:
      - "prototype/**"
    paths:
      - "**.gd"
      - "**.tscn"
      - "**.tres"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/build-windows.yml"
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-windows:
    name: Export Windows x64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot 4.3 and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.3"
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/godot/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          cp -a "$RUNNER_TEMP/godot/templates/templates/." "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Prepare build directory
        run: mkdir -p build

      - name: Import and validate project scripts
        run: '"$GODOT_BIN" --headless --editor --path . --quit'

      - name: Export Windows executable
        run: '"$GODOT_BIN" --headless --path . --export-release "Windows Desktop" build/THE_HOUSE.exe'

      - name: Package game
        run: |
          set -euo pipefail
          test -s build/THE_HOUSE.exe
          cd build
          zip -r ../THE_HOUSE-Windows-x64.zip .

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: THE_HOUSE-Windows-x64
          path: THE_HOUSE-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
