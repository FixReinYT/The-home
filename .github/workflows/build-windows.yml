name: Build THE HOUSE for Windows

on:
  push:
    branches:
      - "prototype/**"
    paths:
      - "**.gd"
      - "**.tscn"
      - "**.tres"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-windows:
    name: Export Windows x64
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare build directory
        run: mkdir -p build

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export Windows executable
        run: godot --headless --path . --export-release "Windows Desktop" build/THE_HOUSE.exe

      - name: Package game
        run: |
          test -f build/THE_HOUSE.exe
          cd build
          zip -r ../THE_HOUSE-Windows-x64.zip .

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: THE_HOUSE-Windows-x64
          path: THE_HOUSE-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
